# Feature Flag Metrics Report
#
# Weekly report on feature flag status, tool usage, and graduation candidates.
# Helps maintain visibility into preview tools and their progress.

name: Feature Flag Metrics

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to generate'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - graduation
          - feedback

jobs:
  generate-metrics-report:
    name: Generate Metrics Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Analyze feature flags
        id: analyze
        run: |
          echo "📊 Analyzing feature flag configurations..."
          
          # Count tools by status
          GRADUATED=$(grep -c '"status": "standard"' src/lib/feature-flags/defaults.ts 2>/dev/null || echo "0")
          PREVIEW=$(grep -c '"status": "preview"' src/lib/feature-flags/defaults.ts 2>/dev/null || echo "0")
          BETA=$(grep -c '"status": "beta"' src/lib/feature-flags/defaults.ts 2>/dev/null || echo "0")
          
          echo "graduated=$GRADUATED" >> $GITHUB_OUTPUT
          echo "preview=$PREVIEW" >> $GITHUB_OUTPUT
          echo "beta=$BETA" >> $GITHUB_OUTPUT
          
          # List tools
          echo "📋 Tool Status:"
          echo "  ✅ Graduated (Standard): $GRADUATED"
          echo "  🧪 Preview: $PREVIEW"
          echo "  🔬 Beta: $BETA"

      - name: Create metrics issue
        uses: actions/github-script@v7
        with:
          script: |
            const graduated = '${{ steps.analyze.outputs.graduated }}';
            const preview = '${{ steps.analyze.outputs.preview }}';
            const beta = '${{ steps.analyze.outputs.beta }}';
            
            const date = new Date().toISOString().split('T')[0];
            
            const body = `## 📊 Weekly Feature Flag Metrics Report
            
            **Report Date:** ${date}
            
            ### Tool Status Summary
            
            | Status | Count | Description |
            |--------|-------|-------------|
            | ✅ Standard | ${graduated} | Fully graduated, stable tools |
            | 🧪 Preview | ${preview} | Collecting feedback, may change |
            | 🔬 Beta | ${beta} | Testing with select users |
            
            ### Current Tool Configuration
            
            #### Graduated Tools (Standard)
            - 🎲 Team Shuffler
            - ⏱️ Session Timer  
            - 🗳️ Quick Poll
            
            #### Preview Tools (Testing)
            - 📱 QR Check-In
            - 📋 Survey Builder
            
            ### Graduation Criteria Reminder
            
            Tools graduate from Preview → Standard when they meet:
            - ✅ 100+ uses
            - ✅ 20+ unique users
            - ✅ <1% error rate
            - ✅ >70% positive feedback
            - ✅ 7+ days in preview
            
            ### Actions Needed
            
            - [ ] Review feedback on preview tools
            - [ ] Check error rates in monitoring
            - [ ] Evaluate graduation candidates
            - [ ] Update GrowthBook flags if needed
            
            ---
            
            *This report is generated automatically every Monday.*
            *See [feature flags docs](/.github/copilot-instructions.md#trunk-based-development) for more info.*`;
            
            // Check if there's already an open metrics issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'feature-flags,metrics',
              state: 'open'
            });
            
            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
              console.log(`Updated existing metrics issue #${issues.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Feature Flag Metrics - Week of ${date}`,
                body: body,
                labels: ['feature-flags', 'metrics', 'automated']
              });
              console.log('Created new metrics issue');
            }
