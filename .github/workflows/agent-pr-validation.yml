name: Agent PR Validation & Notification

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ============================================
  # JOB 1: VALIDATE IMPLEMENTATION HAS PROPER TESTS
  # ============================================
  test-validation:
    name: Validate Tests Exist
    runs-on: ubuntu-latest
    outputs:
      has_unit_tests: ${{ steps.validate.outputs.has_unit_tests }}
      has_e2e_tests: ${{ steps.validate.outputs.has_e2e_tests }}
      test_coverage_ok: ${{ steps.coverage.outputs.ok }}
      linked_issue: ${{ steps.issue.outputs.number }}
      validation_valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get linked issue number
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const { getLinkedIssueNumber } = await import('${{ github.workspace }}/.github/scripts/validate-pr-tests.mjs');
            const pr = context.payload.pull_request;
            const issueNumber = getLinkedIssueNumber(pr);
            
            core.setOutput('number', issueNumber || '');
            core.setOutput('found', issueNumber ? 'true' : 'false');

      - name: Get changed files and validate
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const { analyzeChangedFiles, validateTestRequirements } = await import('${{ github.workspace }}/.github/scripts/validate-pr-tests.mjs');
            
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 300
            });
            
            const changedFiles = analyzeChangedFiles(files);
            const validation = validateTestRequirements(changedFiles, context.payload.pull_request);
            
            console.log('Changed files:', JSON.stringify(changedFiles));
            console.log('Validation:', JSON.stringify(validation));
            
            // Set outputs
            Object.entries(validation).forEach(([key, value]) => {
              core.setOutput(key, String(value));
            });
            
            core.setOutput('src_files', changedFiles.srcFiles.join('\n'));
            core.setOutput('src_count', String(changedFiles.srcCount));

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and check coverage
        id: coverage
        continue-on-error: true
        run: |
          npm run test:unit -- --coverage --reporter=json --outputFile=coverage-report.json || true
          
          if [ -f "coverage/coverage-summary.json" ]; then
            LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            FUNCTIONS=$(jq '.total.functions.pct' coverage/coverage-summary.json)
            BRANCHES=$(jq '.total.branches.pct' coverage/coverage-summary.json)
            
            echo "Coverage: lines=$LINES%, functions=$FUNCTIONS%, branches=$BRANCHES%"
            
            if (( $(echo "$LINES >= 80" | bc -l) )) && \
               (( $(echo "$FUNCTIONS >= 80" | bc -l) )) && \
               (( $(echo "$BRANCHES >= 80" | bc -l) )); then
              echo "ok=true" >> $GITHUB_OUTPUT
              echo "✅ Coverage thresholds met"
            else
              echo "ok=false" >> $GITHUB_OUTPUT
              echo "❌ Coverage thresholds not met"
            fi
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "⚠️ Coverage report not found"
          fi

      - name: Post validation comment on PR
        if: steps.validate.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { generateValidationComment } = await import('${{ github.workspace }}/.github/scripts/validate-pr-tests.mjs');
            
            const validation = {
              requiresUnit: '${{ steps.validate.outputs.requiresUnit }}' === 'true',
              requiresE2E: '${{ steps.validate.outputs.requiresE2E }}' === 'true',
              hasUnitTests: '${{ steps.validate.outputs.hasUnitTests }}' === 'true',
              hasE2ETests: '${{ steps.validate.outputs.hasE2ETests }}' === 'true',
              touchesCritical: '${{ steps.validate.outputs.touchesCritical }}' === 'true'
            };
            
            const coverage = { ok: '${{ steps.coverage.outputs.ok }}' };
            
            const comment = generateValidationComment(validation, coverage);
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });

      - name: Fail if tests missing
        if: steps.validate.outputs.valid == 'false'
        run: |
          echo "❌ Implementation is missing required tests"
          echo "Unit tests required: ${{ steps.validate.outputs.requiresUnit }}"
          echo "Unit tests present: ${{ steps.validate.outputs.hasUnitTests }}"
          echo "E2E tests required: ${{ steps.validate.outputs.requiresE2E }}"
          echo "E2E tests present: ${{ steps.validate.outputs.hasE2ETests }}"
          exit 1

  # ============================================
  # JOB 2: NOTIFY ISSUE CREATOR WHEN PR IS READY
  # ============================================
  notify-issue-creator:
    name: Notify Issue Creator
    runs-on: ubuntu-latest
    needs: test-validation
    if: needs.test-validation.outputs.linked_issue != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get issue details and notify creator
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { generateIssueNotification } = await import('${{ github.workspace }}/.github/scripts/validate-pr-tests.mjs');
            
            const pr = context.payload.pull_request;
            const prAuthor = pr.user.login;
            const issueNumber = parseInt('${{ needs.test-validation.outputs.linked_issue }}');
            
            // Skip notification for bots and main contributors
            const skipUsers = ['dependabot[bot]', 'copilot[bot]', 'github-actions[bot]', 'dmgrok', 'a447ah'];
            if (skipUsers.includes(prAuthor)) {
              console.log(`Skipping notification for ${prAuthor} (bot or main contributor)`);
              return;
            }
            
            if (!issueNumber) {
              console.log('No linked issue found, skipping notification');
              return;
            }
            
            // Check if issue exists before proceeding
            let issue;
            try {
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            } catch (error) {
              console.log(`Issue #${issueNumber} not found or inaccessible: ${error.message}`);
              return;
            }
            
            const isNewPR = context.payload.action === 'opened';
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            
            const alreadyNotified = comments.some(c => 
              c.body.includes('Implementation Started') &&
              c.body.includes(`#${pr.number}`)
            );
            
            if (alreadyNotified) {
              console.log('Already notified about this PR, skipping');
              return;
            }
            
            if (!isNewPR && !pr.draft === false) {
              console.log('Not a new PR or ready for review, skipping notification');
              return;
            }
            
            const validation = {
              hasUnitTests: '${{ needs.test-validation.outputs.has_unit_tests }}' === 'true',
              hasE2ETests: '${{ needs.test-validation.outputs.has_e2e_tests }}' === 'true'
            };
            
            const coverage = { ok: '${{ needs.test-validation.outputs.test_coverage_ok }}' };
            
            const notification = generateIssueNotification(pr, issue, validation, coverage);
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: notification
            });
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['implementation-in-progress']
            });
            
            console.log(`✅ Notified @${issue.user.login} about PR #${pr.number}`);

  # ============================================
  # JOB 3: NOTIFY ON PR MERGE (Implementation Complete)
  # ============================================
  notify-on-merge:
    name: Notify on Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify issue creator of completion
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { getLinkedIssueNumber, generateCompletionNotification } = await import('${{ github.workspace }}/.github/scripts/validate-pr-tests.mjs');
            
            const pr = context.payload.pull_request;
            const prAuthor = pr.user.login;
            const issueNumber = getLinkedIssueNumber(pr);
            
            // Skip notification for bots and main contributors
            const skipUsers = ['dependabot[bot]', 'copilot[bot]', 'github-actions[bot]', 'dmgrok', 'a447ah'];
            if (skipUsers.includes(prAuthor)) {
              console.log(`Skipping notification for ${prAuthor} (bot or main contributor)`);
              return;
            }
            
            if (!issueNumber) {
              console.log('No linked issue found');
              return;
            }
            
            // Check if issue exists before proceeding
            let issue;
            try {
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber)
              });
              issue = response.data;
            } catch (error) {
              console.log(`Issue #${issueNumber} not found or inaccessible: ${error.message}`);
              return;
            }
            
            const notification = generateCompletionNotification(pr, issue);
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body: notification
            });
            
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                name: 'implementation-in-progress'
              });
            } catch (e) {
              // Label might not exist
            }
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              labels: ['implemented', 'deployed']
            });
            
            if (issue.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                state: 'closed',
                state_reason: 'completed'
              });
            }
            
            console.log(`✅ Notified @${issue.user.login} that issue #${issueNumber} is complete`);
