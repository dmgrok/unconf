name: Prompt Injection Scanner

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  scan:
    name: Lakera Guard Scan
    runs-on: ubuntu-latest
    outputs:
      is_injection: ${{ steps.lakera.outputs.is_injection }}
      categories: ${{ steps.lakera.outputs.categories }}
    steps:
      - name: Scan with Lakera Guard
        id: lakera
        uses: actions/github-script@v7
        env:
          LAKERA_GUARD_API_KEY: ${{ secrets.LAKERA_GUARD_API_KEY }}
        with:
          script: |
            // Get content based on event type
            let content = '';
            let contentSource = '';
            
            if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              content = `${issue.title || ''}\n\n${issue.body || ''}`;
              contentSource = `Issue #${issue.number}`;
            } else if (context.eventName === 'issue_comment') {
              content = context.payload.comment.body || '';
              contentSource = `Comment on Issue #${context.payload.issue.number}`;
            } else if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              content = `${pr.title || ''}\n\n${pr.body || ''}`;
              contentSource = `PR #${pr.number}`;
            }
            
            if (!content.trim()) {
              console.log('No content to scan');
              core.setOutput('is_injection', 'false');
              core.setOutput('categories', '[]');
              return;
            }
            
            const apiKey = process.env.LAKERA_GUARD_API_KEY;
            if (!apiKey) {
              console.log('⚠️ LAKERA_GUARD_API_KEY not configured - skipping scan');
              core.setOutput('is_injection', 'false');
              core.setOutput('categories', '[]');
              return;
            }
            
            try {
              // Call Lakera Guard API v2
              // Docs: https://docs.lakera.ai/docs/api
              const response = await fetch('https://api.lakera.ai/v2/guard', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  messages: [{ role: 'user', content: content }],
                  breakdown: true
                })
              });
              
              if (!response.ok) {
                const errorText = await response.text();
                console.log(`Lakera API error (${response.status}): ${errorText}`);
                // Don't block on API errors - fail open
                core.setOutput('is_injection', 'false');
                core.setOutput('categories', '[]');
                return;
              }
              
              const result = await response.json();
              
              /*
              Lakera Guard v2 response format:
              {
                "flagged": true/false,
                "breakdown": {
                  "prompt_injection": { "detected": true/false },
                  "jailbreak": { "detected": true/false },
                  ...
                },
                "metadata": { "request_uuid": "..." }
              }
              */
              
              const flagged = result.flagged || false;
              const breakdown = result.breakdown || {};
              
              // Build list of detected categories from breakdown
              const detectedCategories = Object.entries(breakdown)
                .filter(([_, data]) => data?.detected)
                .map(([category, _]) => ({
                  category,
                  detected: true
                }));
              
              console.log(`🔍 Scanned ${contentSource}`);
              console.log(`   Flagged: ${flagged}`);
              console.log(`   Categories: ${JSON.stringify(detectedCategories)}`);
              
              core.setOutput('is_injection', flagged ? 'true' : 'false');
              core.setOutput('categories', JSON.stringify(detectedCategories));
              
            } catch (error) {
              console.log(`Lakera scan error: ${error.message}`);
              // Fail open on errors
              core.setOutput('is_injection', 'false');
              core.setOutput('categories', '[]');
            }

      - name: Flag Detected Injection
        if: steps.lakera.outputs.is_injection == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const categories = JSON.parse('${{ steps.lakera.outputs.categories }}');
            const categoryList = categories.map(c => `- ${c.category}`).join('\n');
              number = context.payload.pull_request.number;
              type = 'pr';
            }
            
            // Add warning label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              labels: ['⚠️ security-review', 'prompt-injection-detected']
            });
            
            // Add comment for maintainers (visible but non-alarming)
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: `⚠️ **Automated Security Notice**

            This ${type} has been flagged for maintainer review before processing.

            <details>
            <summary>Detection details (maintainers only)</summary>

            **Detected categories:**
            ${categoryList || '- Unknown'}

            *Scanned by Lakera Guard. False positives may occur—please review manually.*
            </details>

            ---
            @dmgrok Please review before triaging.`
            });
            
            console.log(`🚨 Flagged ${type} #${number} for security review`);

      - name: Log Clean Scan
        if: steps.lakera.outputs.is_injection == 'false'
        run: |
          echo "✅ Content passed Lakera Guard scan"
