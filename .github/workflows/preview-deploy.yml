name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  # ============================================
  # Vercel Preview Deployment
  # ============================================
  deploy-preview:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'issue-')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract issue number
        id: issue
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          ISSUE_NUMBER=$(echo "$BRANCH_NAME" | grep -o '^issue-[0-9]*' | cut -d'-' -f2)
          echo "number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Comment on PR with deployment info
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = '${{ steps.issue.outputs.number }}';
            const branchName = '${{ steps.issue.outputs.branch }}';
            const prNumber = context.payload.pull_request.number;
            
            const comment = `🚀 **Vercel Preview Deployment**
            
            Your changes are being deployed to Vercel preview environment.
            
            **Branch:** \`${branchName}\`
            **Related Issue:** ${issueNumber ? `#${issueNumber}` : 'N/A'}
            
            ---
            
            ### Preview URLs
            Vercel will automatically deploy this PR and post preview URLs below.
            
            **Note:** Preview deployments are created automatically by Vercel when:
            - A PR is opened
            - New commits are pushed
            - PR is synchronized
            
            Check the Vercel bot comment below for the actual preview URL.
            
            ---
            *Automated preview deployment trigger*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

      - name: Link PR to issue
        if: steps.issue.outputs.number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = '${{ steps.issue.outputs.number }}';
            const prNumber = context.payload.pull_request.number;
            const prUrl = context.payload.pull_request.html_url;
            
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: `🔗 **Pull Request Created**\n\nPR #${prNumber} has been opened for this issue.\n\n[View Pull Request →](${prUrl})\n\n---\n*Vercel preview will be available in the PR*`
              });
              
              console.log(`Linked PR #${prNumber} to issue #${issueNumber}`);
            }
