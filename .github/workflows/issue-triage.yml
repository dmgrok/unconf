name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  # ============================================
  # JOB 0: LAKERA GUARD SCAN (Fast ML-based detection)
  # ============================================
  lakera-scan:
    runs-on: ubuntu-latest
    outputs:
      is_flagged: ${{ steps.lakera.outputs.is_flagged }}
      categories: ${{ steps.lakera.outputs.categories }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan with Lakera Guard
        id: lakera
        uses: actions/github-script@v7
        env:
          LAKERA_GUARD_API_KEY: ${{ secrets.LAKERA_GUARD_API_KEY }}
        with:
          script: |
            const { scanWithLakeraGuard } = await import('${{ github.workspace }}/.github/scripts/security-scan.mjs');
            const issue = context.payload.issue;
            const content = `${issue.title || ''}\n\n${issue.body || ''}`;
            const apiKey = process.env.LAKERA_GUARD_API_KEY;
            
            const result = await scanWithLakeraGuard(content, apiKey);
            
            core.setOutput('is_flagged', result.is_flagged ? 'true' : 'false');
            core.setOutput('categories', JSON.stringify(result.categories));

      - name: Block Detected Injection
        if: steps.lakera.outputs.is_flagged == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const categories = JSON.parse('${{ steps.lakera.outputs.categories }}');
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['security-review', 'prompt-injection']
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: '❌ **Issue Blocked**\n\nThis issue could not be processed by our automated system. If this is a legitimate request, please rephrase and try again using our [issue templates](../../issues/new/choose).\n\n---\n*Automated screening*'
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
            
            console.log(`🚨 Issue #${issue.number} blocked by Lakera Guard: ${JSON.stringify(categories)}`);

  # ============================================
  # JOB 1: AI SECURITY SCREENING (backup layer)
  # ============================================
  security-screening:
    needs: lakera-scan
    if: needs.lakera-scan.outputs.is_flagged != 'true'
    runs-on: ubuntu-latest
    outputs:
      is_safe: ${{ steps.screen.outputs.is_safe }}
      threat_type: ${{ steps.screen.outputs.threat_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AI Security Screen
        id: screen
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { aiSecurityScreen } = await import('${{ github.workspace }}/.github/scripts/security-scan.mjs');
            const issue = context.payload.issue;
            const content = `${issue.title || ''}\n\n${issue.body || ''}`;
            
            const result = await aiSecurityScreen(content, process.env.GITHUB_TOKEN);
            
            core.setOutput('is_safe', result.isSafe ? 'true' : 'false');
            core.setOutput('threat_type', result.threatType || 'none');

      - name: Handle Unsafe Issue
        if: steps.screen.outputs.is_safe == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const threatType = '${{ steps.screen.outputs.threat_type }}';
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['security-review', 'flagged-by-ai']
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `⚠️ **Security Review Required**\n\nThis issue has been flagged for manual security review. If this is a legitimate request, a maintainer will reopen it.\n\n---\n*Automated screening*`
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
            
            console.log(`Issue #${issue.number} blocked - Threat: ${threatType}`);

  # ============================================
  # JOB 2: TRIAGE (only if security passes)
  # ============================================
  triage:
    needs: security-screening
    if: needs.security-screening.outputs.is_safe == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Functionality Manifest
        id: manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ github.workspace }}/.github/FUNCTIONALITY_MANIFEST.json';
            
            if (!fs.existsSync(path)) {
              console.log('Manifest not found, using empty manifest');
              core.setOutput('manifest', JSON.stringify({ tools: {}, outOfScope: { categories: [] }, evaluationCriteria: { mustHave: [] } }));
              return;
            }
            
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            core.setOutput('manifest', JSON.stringify(manifest));

      - name: Triage Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { triageIssue } = await import('${{ github.workspace }}/.github/scripts/triage-issue.mjs');
            const manifest = JSON.parse('${{ steps.manifest.outputs.manifest }}');
            
            await triageIssue(github, context, manifest);

  # ============================================
  # JOB 3: IMPLEMENTATION SETUP (for accepted high-value issues)
  # ============================================
  implementation-setup:
    needs: triage
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Check if high-value issue
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels?.map(l => l.name) || [];
            const isHighValue = labels.includes('high-value');
            const needsReview = labels.includes('needs-review');
            core.setOutput('should_implement', (isHighValue && needsReview) ? 'true' : 'false');
            return isHighValue && needsReview;

      - name: Checkout repository
        if: steps.check.outputs.should_implement == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create feature branch
        if: steps.check.outputs.should_implement == 'true'
        id: branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const title = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9\s-]/g, '')
              .replace(/\s+/g, '-')
              .substring(0, 50);
            
            const branchName = `issue-${issueNumber}-${title}`;
            
            try {
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main'
              });
              
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: ref.object.sha
              });
              
              console.log(`✅ Created branch: ${branchName}`);
              core.setOutput('branch_name', branchName);
              core.setOutput('created', 'true');
            } catch (error) {
              if (error.status === 422) {
                console.log(`Branch ${branchName} already exists`);
                core.setOutput('branch_name', branchName);
                core.setOutput('created', 'false');
              } else {
                throw error;
              }
            }

      - name: Update issue labels and assign
        if: steps.check.outputs.should_implement == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const branchName = '${{ steps.branch.outputs.branch_name }}';
            
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              name: 'needs-review'
            }).catch(() => {});
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['ready-for-implementation', 'agent-assigned']
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🤖 **Ready for Implementation**\n\nThis high-value issue has been prepared for implementation.\n\n**Branch created:** \`${branchName}\`\n\nA coding agent can now work on this issue. The implementation should include:\n- ✅ Feature code\n- ✅ Unit tests (80%+ coverage)\n- ✅ Documentation updates\n\n---\n*Automated setup*`
            });
            
            console.log(`✅ Issue #${issue.number} moved to implementation with branch: ${branchName}`);
