name: Security Scanning

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        id: npm-audit
        run: |
          npm audit --audit-level=moderate > npm-audit.txt 2>&1 || echo "AUDIT_FAILED=true" >> $GITHUB_OUTPUT
          cat npm-audit.txt
        continue-on-error: true
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
      
      - name: Run Security Tests
        run: npm run test:security || true
        continue-on-error: true
      
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: |
            npm-audit.txt
            security-report.json
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let auditText = 'Security scan completed.';
            
            if (fs.existsSync('npm-audit.txt')) {
              const audit = fs.readFileSync('npm-audit.txt', 'utf8');
              auditText = `### 🔒 Security Scan Results\n\n\`\`\`\n${audit.substring(0, 2000)}\n\`\`\``;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: auditText
            });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [security-audit, dependency-review, codeql-analysis, secret-scanning]
    if: always()
    
    steps:
      - name: Check security status
        run: |
          echo "Security checks completed"
          if [ "${{ needs.security-audit.result }}" == "failure" ]; then
            echo "❌ Security audit failed"
            exit 1
          fi
          if [ "${{ needs.dependency-review.result }}" == "failure" ]; then
            echo "❌ Dependency review failed"
            exit 1
          fi
          if [ "${{ needs.codeql-analysis.result }}" == "failure" ]; then
            echo "❌ CodeQL analysis failed"
            exit 1
          fi
          if [ "${{ needs.secret-scanning.result }}" == "failure" ]; then
            echo "❌ Secret scanning failed"
            exit 1
          fi
          echo "✅ All security checks passed"
